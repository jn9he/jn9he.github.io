---
title: "Categories"
layout: default
permalink: /categories
---

<div class="container py-5">
    <h1 class="mb-4">Categories</h1>

    {% for category in site.categories %}
    <div class="category-section mb-5" id="{{ category[0] | downcase }}">
        <h3 class="mb-3">{{ category[0] }} <span class="badge badge-secondary">{{ category[1].size }}</span></h3>
        <div class="list-group">
            {% for post in category[1] %}
            <a href="{{ site.baseurl }}{{ post.url }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ post.title }}
                <small class="text-muted">{{ post.date | date: '%b %d, %Y' }}</small>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
